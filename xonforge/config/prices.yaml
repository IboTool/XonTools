# USD per million tokens (XONFORGE_SPEC.md §4.2), by provider and model id; reasoning tokens are billed as output.
# cache_read and cache_write: what an input token read from or written to the provider's prompt cache costs, as a
# multiple of the input price (1 when not given), charged where the provider reports such tokens.
#
# Anthropic's rows were checked in Anthropic's documentation on 2026-09-25 (the user's decisions,
# xonforge/docs/decisions.md): the prices at https://docs.claude.com/en/docs/about-claude/pricing, the model ids and
# retirement dates at https://docs.claude.com/en/docs/about-claude/models/overview. cache_write is the 5-minute
# write's rate. From the same page, and not applied, since XonForge asks for none of them: a 1-hour cache write costs
# 2x the input price, the Batch API halves every price, and inference_geo "us" costs 1.1x (the default, global, is the
# standard price). Sonnet 5's standard price is $2/$10: the increase to $3/$15 planned for 2026-09-01 was cancelled.
# Haiku 4.5 is not used.
#
# The other rows NEED VERIFICATION: no other provider's pricing page could be reached when they were written
# (2026-09-25). Check each against the provider's current pricing page, then set verified: true and give the date and
# source.

anthropic:
  claude-fable-5-1: {input: 10.0, output: 50.0, cache_read: 0.025, cache_write: 1.25, verified: true,
                     retirement_not_before: "2027-09-01", source: "Anthropic's pricing page, checked 2026-09-25"}
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.05, cache_write: 1.25, verified: true,
                    retirement_not_before: "2027-09-22", source: "Anthropic's pricing page, checked 2026-09-25"}
  claude-sonnet-5: {input: 2.0, output: 10.0, cache_read: 0.1, cache_write: 1.25, verified: true,
                    retirement_not_before: "2027-06-30", source: "Anthropic's pricing page, checked 2026-09-25"}
  claude-haiku-4-5-20251001: {input: 1.0, output: 5.0, cache_read: 0.1, cache_write: 1.25, verified: true,
                              retirement_not_before: "2026-10-15",
                              source: "Anthropic's pricing page, checked 2026-09-25"}
